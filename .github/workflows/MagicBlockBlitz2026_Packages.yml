name: Build Magic Block Blitz 2026

on:
  push:
    branches:
      - main
    paths:
      - 'Apps/EnBlocks2026/**'
      - '.github/workflows/MagicBlockBlitz2026_Packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/EnBlocks2026
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Prepare Web Directory
        run: |
          mkdir -p dist
          cp www/index.html www/index.js www/index.css www/manifest.json www/service-worker.js dist/ || true
          cp -r www/assets dist/ || true

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --progress=false
          else
            npm install --no-audit --no-fund --no-progress
          fi

      - name: Inject Capacitor Configuration (ensure appId matches App Store)
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bekeiratapps.magicblitzblitz2026",
            "appName": "Magic Block Blitz 2026",
            "webDir": "dist"
          }
          EOF

      - name: Initialize or Sync Android Platform (safer)
        run: |
          if [ ! -d "android" ]; then
            npx --yes --package @capacitor/cli@6 cap add android
          else
            npx --yes --package @capacitor/cli@6 cap sync android
          fi

      - name: Setup Java (use Java 17 by default)
        uses: actions/setup-java@v4.4.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew || true
          fi
          ls -la android/gradlew || true

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          ls -lah android/app || true

      - name: Build and Sign Release APK via Gradle
        env:
          ORG_GRADLE_PROJECT_androidInjectedSigningStoreFile: ${{ github.workspace }}/Apps/EnBlocks2026/android/app/release.keystore
          ORG_GRADLE_PROJECT_androidInjectedSigningStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidInjectedSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_androidInjectedSigningKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon --console=plain
          else
            echo "gradlew not found - cannot build"
            exit 1
          fi

      - name: Locate and Upload APK/AAB
        run: |
          mkdir -p final_output
          # Find either an APK or AAB produced by the Android build
          APK_AAB_PATH=$(find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) | head -n 1 || true)
          if [ -n "$APK_AAB_PATH" ]; then
            echo "Found artifact: $APK_AAB_PATH"
            EXT="${APK_AAB_PATH##*.}"
            cp "$APK_AAB_PATH" final_output/MagicBlockBlitz2026-Final.$EXT
            ls -lah final_output || true
          else
            echo "No APK or AAB found in android/app/build/outputs"
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

      - name: Upload Verified APK/AAB
        uses: actions/upload-artifact@v4.6.1
        with:
          name: MagicBlockBlitz2026-Android-Release
          path: final_output/MagicBlockBlitz2026-Final.*

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/EnBlocks2026
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Prepare Web Directory
        run: |
          mkdir -p dist
          cp www/index.html www/index.js www/index.css www/manifest.json www/service-worker.js dist/ || true
          cp -r www/assets dist/ || true

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --progress=false
          else
            npm install --no-audit --no-fund --no-progress
          fi

      - name: Inject Capacitor Configuration (appId must match provisioning profile)
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bekeiratapps.magicblitzblitz2026",
            "appName": "Magic Block Blitz 2026",
            "webDir": "dist"
          }
          EOF

      - name: Initialize or Sync iOS Platform (safer)
        run: |
          if [ ! -d "ios" ]; then
            npx --yes --package @capacitor/cli@6 cap add ios
          else
            npx --yes --package @capacitor/cli@6 cap sync ios
          fi

      - name: Import Apple Certificate to Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH
          echo "Certificate imported"

      - name: Extract Provisioning Profile Details
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PLIST_PATH=$RUNNER_TEMP/profile.plist
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security cms -D -i "$PP_PATH" > $PLIST_PATH
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $PLIST_PATH)
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $PLIST_PATH)
          echo "APPLE_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $PLIST_PATH)
          echo "PROFILE_NAME=$APP_NAME" >> $GITHUB_ENV
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $PLIST_PATH | sed 's/.*\.//')
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Profile UUID: $PROFILE_UUID  Bundle ID: $BUNDLE_ID"

      - name: Verify bundle ID and print current project settings
        run: |
          echo "Provisioning bundle id: $BUNDLE_ID"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -showBuildSettings | grep PRODUCT_BUNDLE_IDENTIFIER || true
          CURRENT_BUNDLE=$(xcodebuild -workspace ios/App/App.xcworkspace -scheme App -showBuildSettings | awk -F= '/PRODUCT_BUNDLE_IDENTIFIER/ { gsub(/ /,"",$2); print $2; exit }' || true)
          echo "CURRENT_BUNDLE=$CURRENT_BUNDLE"
          if [ -n "$CURRENT_BUNDLE" ] && [ "$CURRENT_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "Note: project bundle id differs from provisioning profile. We will override at build-time using xcodebuild PRODUCT_BUNDLE_IDENTIFIER."
          fi

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod repo update
          pod install --repo-update

      - name: Build and Archive iOS App (override PRODUCT_BUNDLE_IDENTIFIER)
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          cd ios/App
          echo "Team: $APPLE_TEAM_ID  Profile UUID: $PROFILE_UUID  Bundle: $BUNDLE_ID"
          # Pass PRODUCT_BUNDLE_IDENTIFIER to override project settings for archive
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            -quiet

      - name: Export IPA Package with dynamic bundle id mapping
        run: |
          mkdir -p ios/App/output
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ios/App/output \
            -quiet

      - name: Verify IPA Output
        run: |
          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA produced"
            ls -lah ios/App/output || true
            exit 1
          fi
          echo "IPA: $IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload Signed IPA to Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: MagicBlockBlitz2026-iOS-Release
          path: ios/App/output/*.ipa

      - name: Upload to TestFlight via App Store Connect API
        if: success()
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          API_KEYS_DIR=~/private_keys
          mkdir -p "$API_KEYS_DIR"
          echo "$KEY_CONTENT" > "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"
          chmod 600 "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"
          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          xcrun notarytool submit "$IPA_PATH" \
            --key-id "$KEY_ID" \
            --issuer-id "$ISSUER_ID" \
            --key "$API_KEYS_DIR/AuthKey_$KEY_ID.p8" \
            --wait