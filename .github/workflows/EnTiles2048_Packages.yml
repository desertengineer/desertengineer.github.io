name: Build EnTiles 2048

on:
  push:
    branches:
      - main
    paths:
      - 'Apps/EnTiles2048/**'
      - '.github/workflows/EnTiles2048_Packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- SIGNED ANDROID BUILD ---
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/EnTiles2048
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Prepare Web Directory
        run: |
          mkdir -p dist
          cp www/index.html www/index.js www/index.css www/manifest.json www/service-worker.js dist/ || true
          cp -r www/assets dist/ || true

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Inject Capacitor Configuration Blueprint
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.desertengineer.tilemaster2048",
            "appName": "EnTiles 2048",
            "webDir": "dist"
          }
          EOF

      - name: Initialize or Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Building Android core framework structures..."
            npx cap add android
          else
            echo "Syncing updated production asset structures..."
            npx cap sync android
          fi

      - name: Setup Java
        uses: actions/setup-java@v4.4.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Resolve Android Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.configureEach { configuration ->
                  configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Align APK File
        run: |
          APK_RAW=$(find android/app/build/outputs/apk/release/ -name "*-release-unsigned.apk" -o -name "*-release.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$APK_RAW" android/app/build/outputs/apk/release/EnTiles2048-aligned.apk

      - name: Cryptographically Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASS" \
            --out android/app/build/outputs/apk/release/EnTiles2048-Final.apk \
            android/app/build/outputs/apk/release/EnTiles2048-aligned.apk

      - name: Upload Verified APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: EnTiles2048-Android-Release
          path: Apps/EnTiles2048/android/app/build/outputs/apk/release/EnTiles2048-Final.apk


  # --- SIGNED iOS BUILD & TESTFLIGHT DELIVERY ---
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/EnTiles2048
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Prepare Web Directory
        run: |
          mkdir -p dist
          cp www/index.html www/index.js www/index.css www/manifest.json www/service-worker.js dist/ || true
          cp -r www/assets dist/ || true

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: Inject Capacitor Configuration Blueprint
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.desertengineer.tilemaster2048",
            "appName": "EnTiles 2048",
            "webDir": "dist"
          }
          EOF

      - name: Initialize or Sync iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            echo "Building iOS core wrapper assets..."
            npx cap add ios
          else
            echo "Synchronizing current web directory variables..."
            npx cap sync ios
          fi

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE }}
          KEYCHAIN_PASSWORD: "temporary_keychain_password"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/profile.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
          echo "APPLE_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

      - name: Setup Xcode Command Line Tools
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and Archive iOS App
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA Package
        run: |
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ios/App/output

      - name: Upload Signed IPA to Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: EnTiles2048-iOS-Release
          path: Apps/EnTiles2048/ios/App/output/*.ipa

      - name: Transmit Deployment to Apple TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          API_KEYS_DIR=~/private_keys
          mkdir -p "$API_KEYS_DIR"
          echo "$KEY_CONTENT" > "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"
          
          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          
          echo "Uploading package asset directly to App Store Connect TestFlight..."
          xcrun xcdevice upload "${{ env.APPLE_TEAM_ID }}" "$IPA_PATH" --api-key "$KEY_ID" --api-issuer "$ISSUER_ID" || \
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
