<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Supply-Chain Referrer Transmission for Network Ad Attributon -->
    <meta name="referrer" content="origin-when-cross-origin">
    <title>Bekeirat Software - Arcade & Games Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0a0b10',
                        brandCard: '#12141f',
                        brandNeon: '#00f2fe',
                        brandAccent: '#4facfe'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for web-view wrappers */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0b10; }
        ::-webkit-scrollbar-thumb { background: #12141f; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
    </style>
</head>
<body class="bg-brandDark text-gray-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Navigation Header -->
    <header class="bg-brandCard border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brandNeon to-brandAccent">
                    BEKEIRAT
                </span>
                <span class="hidden sm:inline-block text-xs bg-gray-800 text-gray-400 px-2 py-1 rounded font-mono">
                    GAMES v2.0
                </span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md">
                <input type="text" 
                       id="search-input" 
                       placeholder="Search catalog by title or tag..." 
                       class="w-full bg-brandDark border border-gray-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brandNeon transition-colors" />
            </div>
        </div>

        <!-- Dynamic Category Bar -->
        <nav class="max-w-7xl mx-auto px-4 py-2 overflow-x-auto flex gap-2 border-t border-gray-800/50" id="category-nav">
            <button data-cat="all" class="cat-btn active bg-brandNeon text-black font-bold text-xs px-3 py-1.5 rounded-full transition-all">All Games</button>
            <button data-cat="puzzle" class="cat-btn bg-brandDark border border-gray-800 text-gray-300 font-bold text-xs px-3 py-1.5 rounded-full hover:border-brandNeon transition-all">Puzzle</button>
            <button data-cat="shooting" class="cat-btn bg-brandDark border border-gray-800 text-gray-300 font-bold text-xs px-3 py-1.5 rounded-full hover:border-brandNeon transition-all">Shooting</button>
            <button data-cat="words" class="cat-btn bg-brandDark border border-gray-800 text-gray-300 font-bold text-xs px-3 py-1.5 rounded-full hover:border-brandNeon transition-all">Words</button>
            <button data-cat="arcade" class="cat-btn bg-brandDark border border-gray-800 text-gray-300 font-bold text-xs px-3 py-1.5 rounded-full hover:border-brandNeon transition-all">Arcade</button>
            <button data-cat="action" class="cat-btn bg-brandDark border border-gray-800 text-gray-300 font-bold text-xs px-3 py-1.5 rounded-full hover:border-brandNeon transition-all">Action</button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <!-- Status / Loading Indicator -->
        <div id="status-message" class="hidden text-center py-12 text-gray-400 font-mono text-sm">
            Loading catalog data...
        </div>

        <!-- Games Grid -->
        <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dynamically populated by renderGameGrid() -->
        </div>
    </main>

    <!-- Portal Footer -->
    <footer class="bg-brandCard border-t border-gray-800 mt-12 py-6 text-center text-xs text-gray-500">
        <p>© Bekeirat Software Monetization Engine. All rights reserved.</p>
        <p class="mt-1">Distributed across GitHub Pages, Blogger, Microsoft Store & Amazon Appstore.</p>
    </footer>

    <!-- Portal Orchestration Engine -->
    <script>
        const CONFIG = {
            dataDir: './data/',
            defaultCategory: 'all'
        };

        let currentCatalog = [];

        // 1. Fetch JSON Data Engine (Case-Sensitivity Safe)
        async function loadCategory(categoryName = 'all') {
            const statusMsg = document.getElementById('status-message');
            const gridContainer = document.getElementById('games-grid');
            
            // Normalize slug to lowercase
            const sanitizedCat = categoryName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const targetFile = `${CONFIG.dataDir}${sanitizedCat}.json`;

            statusMsg.classList.remove('hidden');
            statusMsg.innerText = `Loading ${sanitizedCat}...`;
            gridContainer.innerHTML = '';

            try {
                const response = await fetch(targetFile);
                if (!response.ok) throw new Error(`HTTP ${response.status}: Asset not found`);
                
                currentCatalog = await response.json();
                statusMsg.classList.add('hidden');
                renderGameGrid(currentCatalog);

            } catch (error) {
                console.warn(`[!] Pipeline Fallback Triggered: ${error.message}`);
                // Fallback to master all.json if specific category is missing
                if (sanitizedCat !== 'all') {
                    loadCategory('all');
                } else {
                    statusMsg.innerText = 'Error loading game catalog. Please refresh.';
                }
            }
        }

        // 2. Safe Event-Delegated Grid Rendering Engine
        function renderGameGrid(games) {
            const gridContainer = document.getElementById('games-grid');
            gridContainer.innerHTML = '';

            if (!games || games.length === 0) {
                document.getElementById('status-message').classList.remove('hidden');
                document.getElementById('status-message').innerText = 'No games found in this category.';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card bg-brandCard border border-gray-800 rounded-lg overflow-hidden hover:border-brandNeon transition-all cursor-pointer flex flex-col group';
                
                // Dataset bindings prevent string escaping issues
                card.dataset.url = game.url;
                card.dataset.title = game.title;
                card.dataset.provider = game.provider;
                card.dataset.width = game.width || '800';
                card.dataset.height = game.height || '600';

                card.innerHTML = `
                    <div class="relative aspect-video w-full overflow-hidden bg-gray-900">
                        <img src="${game.thumb}" 
                             alt="${game.title}" 
                             loading="lazy" 
                             class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                             onerror="this.src='https://via.placeholder.com/400x225/12141f/00f2fe?text=Bekeirat+Games';"/>
                        <span class="absolute top-2 right-2 bg-black/80 text-[10px] text-brandNeon border border-brandNeon/30 px-1.5 py-0.5 rounded uppercase font-bold tracking-wider">
                            ${game.category}
                        </span>
                    </div>
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <h3 class="text-white font-bold text-sm line-clamp-1 group-hover:text-brandNeon transition-colors">${game.title}</h3>
                        <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-800/60">
                            <span class="text-[10px] text-gray-500 uppercase font-mono">${game.provider}</span>
                            <button class="bg-brandNeon text-black font-extrabold text-[11px] px-2.5 py-1 rounded hover:bg-white transition-colors">
                                PLAY
                            </button>
                        </div>
                    </div>
                `;

                // Safe DOM Listener
                card.addEventListener('click', () => {
                    openGameModal(
                        card.dataset.url,
                        card.dataset.title,
                        card.dataset.width,
                        card.dataset.height,
                        card.dataset.provider
                    );
                });

                gridContainer.appendChild(card);
            });
        }

        // 3. Provider-Aware Modal & Ad SDK Routing Engine
        function openGameModal(url, title, width, height, provider) {
            if (document.getElementById('game-monetization-modal')) return;

            // Provider SDK Hooks
            if (provider === 'gamedistribution') {
                if (typeof gdsdk !== 'undefined' && typeof gdsdk.showAd === 'function') {
                    gdsdk.showAd();
                }
            }

            const modal = document.createElement('div');
            modal.id = 'game-monetization-modal';
            modal.className = 'fixed inset-0 z-[99999] bg-black/95 flex items-center justify-center p-2 sm:p-4';
            
            modal.innerHTML = `
                <div class="relative w-full h-full max-w-6xl max-h-[95vh] mx-auto flex flex-col bg-brandDark border border-gray-800 rounded-lg overflow-hidden shadow-2xl">
                    <!-- Modal Header -->
                    <div class="flex justify-between items-center px-4 py-2.5 bg-brandCard border-b border-gray-800 pointer-events-auto">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-[10px] bg-gray-800 text-brandNeon px-2 py-0.5 rounded uppercase font-mono font-bold">${provider}</span>
                            <h2 class="text-white font-bold text-sm sm:text-base truncate">${title}</h2>
                        </div>
                        <button id="monetization-close-btn" class="text-gray-400 hover:text-red-500 font-bold text-base px-3 py-1 border border-gray-700 hover:border-red-500 rounded transition-colors flex-shrink-0">
                            &times; Close
                        </button>
                    </div>
                    
                    <!-- Game Canvas Frame -->
                    <div class="flex-1 w-full h-full relative bg-black">
                        <iframe src="${url}" 
                                class="w-full h-full border-none" 
                                allow="autoplay; fullscreen; encrypted-media; focus-without-user-activation; screen-wake-lock" 
                                sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
                        </iframe>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden'; 

            // Memory-Safe Cleanup Handler
            document.getElementById('monetization-close-btn').addEventListener('click', closeGameModal);
        }

        function closeGameModal() {
            const modal = document.getElementById('game-monetization-modal');
            if (modal) {
                const iframe = modal.querySelector('iframe');
                if (iframe) {
                    // Purge WebGL context and audio threads
                    iframe.src = 'about:blank';
                    iframe.remove();
                }
                modal.remove();
                document.body.style.overflow = 'auto';
            }
        }

        // 4. UI Interaction Handlers
        document.addEventListener('DOMContentLoaded', () => {
            // Initial catalog load
            loadCategory(CONFIG.defaultCategory);

            // Category Navigation
            const navButtons = document.querySelectorAll('.cat-btn');
            navButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    navButtons.forEach(b => {
                        b.className = 'cat-btn bg-brandDark border border-gray-800 text-gray-300 font-bold text-xs px-3 py-1.5 rounded-full hover:border-brandNeon transition-all';
                    });
                    
                    e.target.className = 'cat-btn active bg-brandNeon text-black font-bold text-xs px-3 py-1.5 rounded-full transition-all';
                    loadCategory(e.target.dataset.cat);
                });
            });

            // Live Client-Side Search Filter
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().strip();
                if (!query) {
                    renderGameGrid(currentCatalog);
                    return;
                }
                
                const filtered = currentCatalog.filter(game => 
                    game.title.toLowerCase().includes(query) || 
                    game.category.toLowerCase().includes(query) ||
                    (game.tags && game.tags.some(t => t.toLowerCase().includes(query)))
                );
                renderGameGrid(filtered);
            });
        });
    </script>
</body>
</html>
