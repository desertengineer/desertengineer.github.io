    <!-- Execution Engine Script -->
    <script>
        const CONFIG = {
            // Evaluates path relative to /pages/ location first
            dataPaths: ['../data/', './data/', '/data/'],
            itemsPerPage: 60,
            defaultCategory: 'all'
        };

        let dataCache = {};
        let currentDataset = [];
        let activeCategory = 'all';
        let activeSubCategory = 'all';
        let searchQuery = '';
        let currentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const yearSpan = document.getElementById('current-year');
            if (yearSpan) yearSpan.textContent = new Date().getFullYear();

            const hamburgerBtn = document.getElementById('hamburger-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (hamburgerBtn && mobileMenu) {
                hamburgerBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                });
            }

            switchCategory(CONFIG.defaultCategory);
        });

        async function switchCategory(category, element = null) {
            activeCategory = category.toLowerCase().trim();
            activeSubCategory = 'all';
            currentPage = 1;

            if (element) {
                document.querySelectorAll('.cat-btn').forEach(btn => {
                    btn.className = 'cat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-800/60 hover:text-white transition-all';
                });
                element.className = 'cat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-blue-400 bg-blue-500/10 border border-blue-500/30 transition-all';
            }

            if (dataCache[activeCategory]) {
                currentDataset = dataCache[activeCategory];
                buildSubCategoryTags();
                renderGrid();
                return;
            }

            showLoadingState();

            let rawData = null;
            let loadedPath = '';

            for (const basePath of CONFIG.dataPaths) {
                const targetFile = `${basePath}${activeCategory}.json`;
                try {
                    const response = await fetch(targetFile);
                    if (response.ok) {
                        rawData = await response.json();
                        loadedPath = targetFile;
                        break;
                    }
                } catch (e) {
                    // Try next path candidate
                }
            }

            if (rawData && Array.isArray(rawData)) {
                dataCache[activeCategory] = rawData.map((item, idx) => ({
                    id: item.id || `game-${idx}`,
                    title: item.title ? item.title.trim() : "Untitled Game",
                    url: item.url || item.gameUrl || '#',
                    category: item.category || activeCategory,
                    tags: Array.isArray(item.tags)
                        ? item.tags.map(t => t.toLowerCase().trim())
                        : (item.tags ? item.tags.split(',').map(t => t.trim().toLowerCase()) : []),
                    thumb: item.thumb || item.thumbnail || item.image || 'https://placehold.co/400x300/12141f/60a5fa?text=Bekeirat+Game',
                    provider: item.provider || 'GameMonetize',
                    width: item.width || "1280",
                    height: item.height || "720"
                }));

                currentDataset = dataCache[activeCategory];
                buildSubCategoryTags();
                renderGrid();
            } else {
                console.error(`[!] Data Pipeline Failure: Unable to fetch /data/${activeCategory}.json.`);
                renderEmptyState(`Unable to load game catalog for "${activeCategory}". Verify that <code>/data/${activeCategory}.json</code> exists on your server and that you are serving via HTTP (Live Server).`);
            }
        }

        function buildSubCategoryTags() {
            const tagsContainer = document.getElementById('tags-filter-bar');
            tagsContainer.innerHTML = '';

            const tagCounts = {};
            currentDataset.forEach(game => {
                if (Array.isArray(game.tags)) {
                    game.tags.forEach(tag => {
                        if (tag) tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                }
            });

            const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]).slice(0, 15);
            if (sortedTags.length === 0) return;

            const allBtn = document.createElement('button');
            allBtn.className = `px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
                activeSubCategory === 'all' ? 'bg-blue-500 text-white font-bold' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
            }`;
            allBtn.textContent = 'All Sub-types';
            allBtn.onclick = () => filterSubCategory('all', allBtn);
            tagsContainer.appendChild(allBtn);

            sortedTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1 rounded-full text-xs font-medium bg-gray-800/80 text-gray-300 hover:bg-gray-700 whitespace-nowrap transition-all capitalize';
                btn.textContent = `${tag} (${tagCounts[tag]})`;
                btn.onclick = () => filterSubCategory(tag, btn);
                tagsContainer.appendChild(btn);
            });
        }

        function filterSubCategory(tag, element) {
            activeSubCategory = tag;
            currentPage = 1;

            Array.from(element.parentElement.children).forEach(child => {
                child.className = 'px-3 py-1 rounded-full text-xs font-medium bg-gray-800/80 text-gray-300 hover:bg-gray-700 whitespace-nowrap transition-all capitalize';
            });
            element.className = 'px-3 py-1 rounded-full text-xs font-bold bg-blue-500 text-white whitespace-nowrap transition-all capitalize';

            renderGrid();
        }

        function handleSearch(query) {
            searchQuery = query.toLowerCase().trim();
            currentPage = 1;
            renderGrid();
        }

        function getFilteredData() {
            return currentDataset.filter(game => {
                const matchesSubCat = (activeSubCategory === 'all' || (Array.isArray(game.tags) && game.tags.includes(activeSubCategory)));
                const matchesSearch = searchQuery === '' ||
                    game.title.toLowerCase().includes(searchQuery) ||
                    (Array.isArray(game.tags) && game.tags.some(t => t.includes(searchQuery)));
                return matchesSubCat && matchesSearch;
            });
        }

        function renderGrid() {
            const gridContainer = document.getElementById('main-games-grid');
            const filtered = getFilteredData();
            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / CONFIG.itemsPerPage) || 1;

            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * CONFIG.itemsPerPage;
            const endIndex = Math.min(startIndex + CONFIG.itemsPerPage, totalItems);
            const pageItems = filtered.slice(startIndex, endIndex);

            document.getElementById('total-games-count').textContent = totalItems.toLocaleString();
            document.getElementById('page-start-idx').textContent = totalItems > 0 ? (startIndex + 1).toLocaleString() : 0;
            document.getElementById('page-end-idx').textContent = endIndex.toLocaleString();

            gridContainer.innerHTML = '';

            if (pageItems.length === 0) {
                renderEmptyState('No games found matching your current filter criteria.');
                renderPagination(1);
                return;
            }

            const fragment = document.createDocumentFragment();
            pageItems.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card group cursor-pointer bg-[#12141f] rounded-xl overflow-hidden border border-gray-800/90 hover:border-blue-500 transition-all duration-300 flex flex-col shadow-md hover:shadow-blue-500/10';

                card.dataset.url = game.url;
                card.dataset.title = game.title;
                card.dataset.width = game.width;
                card.dataset.height = game.height;
                card.dataset.provider = game.provider;

                card.innerHTML = `
                    <div class="game-thumb-container relative w-full aspect-square overflow-hidden bg-[#0a0b10]">
                        <img src="${game.thumb}" 
                             alt="${game.title}" 
                             loading="lazy"
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                             onerror="this.src='https://placehold.co/400x400/12141f/60a5fa?text=${encodeURIComponent(game.title)}'"/>
                    </div>
                    <div class="p-3 bg-[#12141f] border-t border-gray-800/60 flex items-center justify-between flex-1">
                        <h3 class="font-semibold text-xs sm:text-sm text-gray-200 group-hover:text-blue-400 transition-colors truncate" title="${game.title}">
                            ${game.title}
                        </h3>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openGameModal(card.dataset.url, card.dataset.title, card.dataset.width, card.dataset.height, card.dataset.provider);
                });

                fragment.appendChild(card);
            });

            gridContainer.appendChild(fragment);
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-controls');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const createBtn = (label, page, isActive = false, isDisabled = false) => {
                const btn = document.createElement('button');
                btn.innerHTML = label;
                btn.disabled = isDisabled;

                let baseClass = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ";
                if (isDisabled) {
                    baseClass += "bg-gray-900 text-gray-600 cursor-not-allowed border border-gray-800";
                } else if (isActive) {
                    baseClass += "bg-blue-600 text-white font-bold shadow-md shadow-blue-500/20";
                } else {
                    baseClass += "bg-[#12141f] text-gray-300 hover:bg-gray-800 hover:text-white border border-gray-800";
                }

                btn.className = baseClass;
                btn.onclick = () => {
                    if (!isDisabled && page !== currentPage) {
                        currentPage = page;
                        renderGrid();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                };
                return btn;
            };

            container.appendChild(createBtn('&laquo; First', 1, false, currentPage === 1));
            container.appendChild(createBtn('&lsaquo; Prev', currentPage - 1, false, currentPage === 1));

            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                container.appendChild(createBtn('1', 1));
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = "px-2 py-1 text-xs text-gray-500 font-mono";
                    ellipsis.textContent = '...';
                    container.appendChild(ellipsis);
                }
            }

            for (let p = startPage; p <= endPage; p++) {
                container.appendChild(createBtn(p.toString(), p, p === currentPage));
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = "px-2 py-1 text-xs text-gray-500 font-mono";
                    ellipsis.textContent = '...';
                    container.appendChild(ellipsis);
                }
                container.appendChild(createBtn(totalPages.toString(), totalPages));
            }

            container.appendChild(createBtn('Next &rsaquo;', currentPage + 1, false, currentPage === totalPages));
            container.appendChild(createBtn('Last &raquo;', totalPages, false, currentPage === totalPages));
        }

        function showLoadingState() {
            const grid = document.getElementById('main-games-grid');
            grid.innerHTML = `
                <div class="col-span-full py-16 text-center text-gray-400">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mb-3"></div>
                    <p class="text-sm font-semibold">Loading Catalog Data...</p>
                </div>
            `;
        }

        function renderEmptyState(message) {
            const grid = document.getElementById('main-games-grid');
            grid.innerHTML = `
                <div class="col-span-full py-12 text-center text-gray-400 bg-[#12141f] rounded-xl border border-gray-800">
                    <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-sm font-medium text-gray-300 px-4">${message}</p>
                </div>
            `;
        }

        /* Memory-Safe Game Launch Modal */
        window.closeGameModal = function () {
            const modal = document.getElementById('game-monetization-modal');
            if (modal) {
                const iframe = modal.querySelector('iframe');
                if (iframe) {
                    iframe.src = 'about:blank';
                    iframe.remove();
                }
                modal.remove();
                document.body.style.overflow = 'auto';
            }
        };

        window.openGameModal = function (gameUrl, title, width, height, provider = 'GameMonetize') {
            if (document.getElementById('game-monetization-modal')) return;

            const modal = document.createElement('div');
            modal.id = 'game-monetization-modal';
            modal.className = 'fixed inset-0 z-[99999] bg-black/95 flex items-center justify-center p-2 sm:p-4';

            modal.innerHTML = `
                <div class="relative w-full h-full max-w-6xl max-h-[92vh] mx-auto flex flex-col bg-[#0a0b10] border border-gray-800 rounded-lg overflow-hidden shadow-2xl">
                    <div class="flex justify-between items-center px-4 py-2.5 bg-[#12141f] border-b border-gray-800 z-10 pointer-events-auto">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-[10px] bg-gray-800 text-blue-400 px-2 py-0.5 rounded font-mono font-bold uppercase">${provider}</span>
                            <h2 class="text-white font-bold text-sm sm:text-base truncate">${title}</h2>
                        </div>
                        <button id="monetization-close-btn" class="text-gray-400 hover:text-red-500 hover:border-red-500 transition-colors font-bold text-sm px-3 py-1 border border-gray-700 rounded cursor-pointer flex-shrink-0">
                            &times; Close
                        </button>
                    </div>
                    
                    <div class="flex-1 w-full h-full relative bg-black">
                        <iframe src="${gameUrl}" 
                                class="w-full h-full border-none" 
                                allow="autoplay; fullscreen; encrypted-media; focus-without-user-activation; screen-wake-lock" 
                                sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
                        </iframe>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';

            const closeBtn = document.getElementById('monetization-close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', window.closeGameModal);
            }
        };
    </script>
