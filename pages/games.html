          <div class="catalog-toolbar">
            <div class="search-wrap">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input id="game-search" type="text" placeholder="Search games by title or tag..." />
            </div>

            <div class="catalog-count">
              Showing <strong id="page-start">0</strong> -
              <strong id="page-end">0</strong> of
              <strong id="total-items">0</strong>
            </div>
          </div>

          <div class="tag-bar" id="tag-bar"></div>

          <div id="games-grid" class="games-grid"></div>

          <div class="pagination" id="pagination"></div>
        </section>
      </div>
