<script>
/**
 * Bekeirat Software - Scalable Game Engine Integrator
 */
const CONFIG = {
    dataDir: './data/',
    itemsPerPage: 100, // Standard 20 rows x 5 columns
    defaultCategory: 'all'
};

/* State Management */
let dataCache = {};          // Stores parsed JSON per category
let currentDataset = [];     // Active category raw dataset
let activeCategory = 'all';
let activeSubCategory = 'all';
let searchQuery = '';
let currentPage = 1;

document.addEventListener('DOMContentLoaded', () => {
    switchCategory(CONFIG.defaultCategory);
});

/**
 * Async Ingestion of Local JSON Files
 */
async function switchCategory(category, element = null) {
    activeCategory = category.toLowerCase();
    activeSubCategory = 'all';
    currentPage = 1;

    // Update active UI tab states
    if (element) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.className = 'cat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-800/60 hover:text-white transition-all';
        });
        element.className = 'cat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-brandNeon bg-brandNeon/10 border border-brandNeon/30 transition-all';
    }

    // Check memory cache first
    if (dataCache[activeCategory]) {
        currentDataset = dataCache[activeCategory];
        buildSubCategoryTags();
        renderGrid();
        return;
    }

    // Fetch local JSON payload from /data/{category}.json
    const filePath = `${CONFIG.dataDir}${activeCategory}.json`;
    showLoadingState();

    try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error(`HTTP Error ${response.status} - File not found: ${filePath}`);
        
        const rawData = await response.json();
        
        // Normalize GameMonetize data payload structure
        dataCache[activeCategory] = rawData.map(item => ({
            id: item.id,
            title: item.title ? item.title.trim() : "Untitled Game",
            url: item.url,
            category: item.category || "General",
            tags: item.tags ? item.tags.split(',').map(t => t.trim().toLowerCase()) : [],
            thumb: item.thumb || 'https://placehold.co/512x384/151824/00ffcc?text=No+Image',
            width: item.width || "1280",
            height: item.height || "720"
        }));

        currentDataset = dataCache[activeCategory];
        buildSubCategoryTags();
        renderGrid();

    } catch (error) {
        console.error("Data Pipeline Error:", error);
        renderEmptyState(`Unable to load feed data for category "${activeCategory}". Ensure <code>${filePath}</code> exists.`);
    }
}

/**
 * Dynamic Tag Extractor for Sub-Filtering Bar
 */
function buildSubCategoryTags() {
    const tagsContainer = document.getElementById('tags-filter-bar');
    tagsContainer.innerHTML = '';

    const tagCounts = {};
    currentDataset.forEach(game => {
        game.tags.forEach(tag => {
            if (tag) tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        });
    });

    // Extract top 15 tags by frequency
    const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]).slice(0, 15);

    if (sortedTags.length === 0) return;

    // Add 'All Subcategories' pill
    const allBtn = document.createElement('button');
    allBtn.className = `px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
        activeSubCategory === 'all' 
            ? 'bg-brandNeon text-darkBg font-bold' 
            : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
    }`;
    allBtn.textContent = 'All Sub-types';
    allBtn.onclick = () => filterSubCategory('all', allBtn);
    tagsContainer.appendChild(allBtn);

    sortedTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'px-3 py-1 rounded-full text-xs font-medium bg-gray-800/80 text-gray-300 hover:bg-gray-700 whitespace-nowrap transition-all capitalize';
        btn.textContent = `${tag} (${tagCounts[tag]})`;
        btn.onclick = () => filterSubCategory(tag, btn);
        tagsContainer.appendChild(btn);
    });
}

function filterSubCategory(tag, element) {
    activeSubCategory = tag;
    currentPage = 1;
    
    // Toggle active classes on pill elements
    Array.from(element.parentElement.children).forEach(child => {
        child.className = 'px-3 py-1 rounded-full text-xs font-medium bg-gray-800/80 text-gray-300 hover:bg-gray-700 whitespace-nowrap transition-all capitalize';
    });
    element.className = 'px-3 py-1 rounded-full text-xs font-bold bg-brandNeon text-darkBg whitespace-nowrap transition-all capitalize';

    renderGrid();
}

function handleSearch(query) {
    searchQuery = query.toLowerCase().trim();
    currentPage = 1;
    renderGrid();
}

/**
 * Filter Evaluation Pipeline
 */
function getFilteredData() {
    return currentDataset.filter(game => {
        const matchesSubCat = (activeSubCategory === 'all' || game.tags.includes(activeSubCategory));
        const matchesSearch = searchQuery === '' || game.title.toLowerCase().includes(searchQuery);
        return matchesSubCat && matchesSearch;
    });
}

/**
 * High-Density Grid Rendering Engine
 */
function renderGrid() {
    const gridContainer = document.getElementById('main-games-grid');
    const filtered = getFilteredData();
    const totalItems = filtered.length;
    const totalPages = Math.ceil(totalItems / CONFIG.itemsPerPage) || 1;

    if (currentPage > totalPages) currentPage = totalPages;

    const startIndex = (currentPage - 1) * CONFIG.itemsPerPage;
    const endIndex = Math.min(startIndex + CONFIG.itemsPerPage, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    // Update Status Metrics
    document.getElementById('total-games-count').textContent = totalItems.toLocaleString();
    document.getElementById('page-start-idx').textContent = totalItems > 0 ? (startIndex + 1).toLocaleString() : 0;
    document.getElementById('page-end-idx').textContent = endIndex.toLocaleString();

    gridContainer.innerHTML = '';

    if (pageItems.length === 0) {
        renderEmptyState('No games found matching your current filter criteria.');
        renderPagination(1);
        return;
    }

    // Render Cards
    const fragment = document.createDocumentFragment();
    pageItems.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card group cursor-pointer bg-[#151824] rounded-xl overflow-hidden border border-gray-800/90 hover:border-brandNeon transition-all duration-300 neon-glow flex flex-col';
        card.onclick = () => openGameModal(game.url, game.title, game.width, game.height);

        card.innerHTML = `
            <div class="game-thumb-container relative w-full aspect-square overflow-hidden bg-[#0f111a]">
                <img src="${game.thumb}" 
                     alt="${game.title}" 
                     loading="lazy"
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                     onerror="this.src='https://placehold.co/400x400/151824/00ffcc?text=${encodeURIComponent(game.title)}'"/>
            </div>
            <div class="p-2.5 bg-[#151824] border-t border-gray-800/50 flex items-center justify-between">
                <h3 class="font-semibold text-xs sm:text-sm text-gray-200 group-hover:text-brandNeon transition-colors truncate" title="${game.title}">
                    ${game.title}
                </h3>
            </div>
        `;
        fragment.appendChild(card);
    });

    gridContainer.appendChild(fragment);
    renderPagination(totalPages);
}

/**
 * Scalable Pagination System for Large Catalogs
 */
function renderPagination(totalPages) {
    const container = document.getElementById('pagination-controls');
    container.innerHTML = '';

    if (totalPages <= 1) return;

    const createBtn = (label, page, isActive = false, isDisabled = false) => {
        const btn = document.createElement('button');
        btn.innerHTML = label;
        btn.disabled = isDisabled;
        
        let baseClass = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ";
        if (isDisabled) {
            baseClass += "bg-gray-900 text-gray-600 cursor-not-allowed border border-gray-800";
        } else if (isActive) {
            baseClass += "bg-brandNeon text-darkBg font-bold shadow-md shadow-brandNeon/20";
        } else {
            baseClass += "bg-[#151824] text-gray-300 hover:bg-gray-800 hover:text-white border border-gray-800";
        }
        
        btn.className = baseClass;
        btn.onclick = () => {
            if (!isDisabled && page !== currentPage) {
                currentPage = page;
                renderGrid();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
        return btn;
    };

    // First & Previous Buttons
    container.appendChild(createBtn('&laquo; First', 1, false, currentPage === 1));
    container.appendChild(createBtn('&lsaquo; Prev', currentPage - 1, false, currentPage === 1));

    // Dynamic Sliding Page Window Algorithm
    const maxVisiblePages = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
    let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

    if (endPage - startPage + 1 < maxVisiblePages) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
    }

    if (startPage > 1) {
        container.appendChild(createBtn('1', 1));
        if (startPage > 2) {
            const ellipsis = document.createElement('span');
            ellipsis.className = "px-2 py-1 text-xs text-gray-500 font-mono";
            ellipsis.textContent = '...';
            container.appendChild(ellipsis);
        }
    }

    for (let p = startPage; p <= endPage; p++) {
        container.appendChild(createBtn(p.toString(), p, p === currentPage));
    }

    if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
            const ellipsis = document.createElement('span');
            ellipsis.className = "px-2 py-1 text-xs text-gray-500 font-mono";
            ellipsis.textContent = '...';
            container.appendChild(ellipsis);
        }
        container.appendChild(createBtn(totalPages.toString(), totalPages));
    }

    // Next & Last Buttons
    container.appendChild(createBtn('Next &rsaquo;', currentPage + 1, false, currentPage === totalPages));
    container.appendChild(createBtn('Last &raquo;', totalPages, false, currentPage === totalPages));
}

function showLoadingState() {
    const grid = document.getElementById('main-games-grid');
    grid.innerHTML = `
        <div class="col-span-full py-16 text-center text-gray-400">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-brandNeon mb-3"></div>
            <p class="text-sm font-semibold">Loading Catalog Data...</p>
        </div>
    `;
}

function renderEmptyState(message) {
    const grid = document.getElementById('main-games-grid');
    grid.innerHTML = `
        <div class="col-span-full py-12 text-center text-gray-400 bg-[#12141f] rounded-xl border border-gray-800/80">
            <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-sm font-medium text-gray-300">${message}</p>
        </div>
    `;
}

function openGameModal(gameUrl, title, width, height) {
    // Traffic Hand-off & Revenue Sharing Execution
    // Pass iframe URL with allow="autoplay" for GameMonetize Video pre-rolls
    window.open(gameUrl, '_blank');
}
</script>
