<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <style>

          background-color: #3b82f6 !important;

        }

        .mobile-menu-container {
          display: none !important;
          width: 100% !important;
          background-color: #0f172a !important;
          border-top: 1px solid #1e293b !important;
        }

        .mobile-menu-container.active {
          display: block !important;
        }

        .mobile-btn {
          display: block !important;
          padding: 1rem !important;
          border-bottom: 1px solid #1e293b !important;
          transition: background-color 0.2s !important;
        }

        .mobile-btn:hover {
          background-color: #1e293b !important;
          color: #60a5fa !important;
        }

        main {
          flex: 1 !important;
          background-color: rgb(243, 236, 170) !important;
        }

        .social-icon {
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          width: 44px !important;
          height: 44px !important;
          font-size: 30px !important;
          border-radius: 50% !important;
          background-color: #000000 !important;
          color: white !important;
          transition: background-color 0.3s, transform 0.2s !important;
        }

        .social-icon>i {
          color: white !important;
          border-radius: 50% !important;
          width: 100% !important;
          height: 100% !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }

        .social-icon:hover {
          transform: scale(1.1) !important;
        }

        #app-container {
            width: 100%;
            display: flex;
            justify-content: center;
            background-color: #f8fafc;
        }

        #game-container:-webkit-full-screen {
            padding-top: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        #game-container:-moz-full-screen {
            padding-top: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        #game-container:fullscreen {
            padding-top: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        #error-message {
            text-align: center;
            padding: 3rem;
            color: #ef4444;
        }

        #error-message h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        #loading-message {
            text-align: center;
            padding: 3rem;
            font-size: 1.25rem;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar px-4 md:px-8 py-4 flex flex-wrap items-center justify-between border-b border-gray-800/80 bg-[#12141f]">
        <a href="../index.html"
            class="flex items-center gap-3 text-2xl font-bold tracking-wider text-blue-400 hover:text-blue-300 transition-colors">
            <img src="../assets/Bekeirat-Software-120x120.png" alt="Bekeirat Software Logo"
                class="w-[50px] h-[50px] object-contain rounded-lg bg-white/10"
                onerror="this.src='https://placehold.co/120x120/1e293b/60a5fa?text=BS'">
            Bekeirat Software
        </a>

        <button id="hamburger-btn"
            class="md:hidden text-white focus:outline-none hover:text-blue-400 transition-colors p-2"
            aria-label="Toggle Menu" onclick="toggleMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
        </button>

        <div class="hidden md:flex space-x-2 items-center">
            <a href="../index.html" class="nav-btn">Home</a>
            <a href="./about.html" class="nav-btn">About Us</a>
            <a href="./games.html" class="nav-btn active">Games</a>
            <a href="./contact us.html" class="nav-btn">Contacts</a>
        </div>

        <div id="mobile-menu" class="mobile-menu-container hidden md:hidden w-full mt-4 pb-2 shadow-inner">
            <nav class="flex flex-col space-y-1">
                <a href="../index.html" class="mobile-btn px-4 py-2 text-gray-300 hover:bg-gray-800 rounded">Home</a>
                <a href="./about.html" class="mobile-btn px-4 py-2 text-gray-300 hover:bg-gray-800 rounded">About Us</a>
                <a href="./games.html" class="mobile-btn px-4 py-2 text-blue-400 font-bold bg-gray-800/50 rounded">Games</a>
                <a href="./contact us.html" class="mobile-btn px-4 py-2 text-gray-300 hover:bg-gray-800 rounded">Contacts</a>
            </nav>
        </div>
    </nav>

    <div class="page-container" id="app-container">
        <div id="loading-message">Fetching Game Data from data/all.json...</div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-12 px-4 text-center border-t border-gray-800 mt-auto">
        <div class="max-w-4xl mx-auto flex flex-col items-center">
            <div class="mb-8">
                <a href="../privacy/" class="hover:text-white transition-colors underline text-sm">Privacy Policy</a>
            </div>

            <div class="flex flex-wrap justify-center gap-4 md:gap-6 mb-8 bg-[#b6baaa] p-4 rounded-lg">
                <a href="https://x.com/MAWLAY20" class="social-icon twitter" aria-label="Twitter">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 512 512" fill="currentColor">
                        <path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z" />
                    </svg>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61550888326363" class="social-icon facebook" aria-label="Facebook" target="_blank">
                    <i class="fa-brands fa-facebook text-xl"></i>
                </a>
                <a href="https://www.youtube.com/channel/UC-Uc56yi4Ep6_CC1SajWdZw" class="social-icon youtube" aria-label="YouTube">
                    <i class="fa-brands fa-youtube text-xl"></i>
                </a>
            </div>

            <div>
                <p class="text-sm">&copy; <span id="current-year">2026</span> Bekeirat Software. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        // Target the correct JSON path directly as verified
        const JSON_FEED_PATH = 'data/all.json';

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('active');
        }

        async function loadGameData() {
            if (!gameId) {
                showError("No Game ID specified in the URL. Please return to the games list and select a game.");
                return;
            }
            
            try {
                const response = await fetch(JSON_FEED_PATH);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const games = await response.json();
                
                let gameData = null;
                if (Array.isArray(games)) {
                    // Match against string or number ID types securely
                    gameData = games.find(g => String(g.id) === String(gameId) || String(g.gameId) === String(gameId));
                } else if (games && typeof games === 'object') {
                    // In case the JSON root is an object containing a list under a property
                    const list = games.games || games.items || Object.values(games);
                    if (Array.isArray(list)) {
                        gameData = list.find(g => g && (String(g.id) === String(gameId) || String(g.gameId) === String(gameId)));
                    }
                }
                
                if (gameData) {
                    renderGamePage(gameData);
                } else {
                    showError(`Game ID "${gameId}" was not found inside "${JSON_FEED_PATH}". Please verify the game exists in your JSON list.`);
                }
            } catch (err) {
                showError(`Failed to load or parse "${JSON_FEED_PATH}". Error: ${err.message}`);
            }
        }

        function renderGamePage(game) {
            const title = game.title || game.name || "Untitled Game";
            const description = game.description || game.desc || "No description provided.";
            const instructions = game.instructions || game.howto || "Use your mouse or keyboard controls to play.";
            const category = game.category || game.genre || "Arcade";
            const tags = game.tags || game.keywords || "";
            const thumb = game.thumb || game.thumbnail || game.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
            const url = game.url || game.gameUrl || game.link || "";
            const id = game.id || game.gameId || gameId;

            let formattedDesc = String(description).replace(/&ndash;/g, '-').replace(/&amp;/g, '&').replace(/\*\*/g, '');
            
            const tagsArray = String(tags).split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            let tagsHtml = '';
            if (tagsArray.length > 0) {
                tagsArray.forEach(tag => {
                    tagsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-md border border-blue-200">${tag}</span>`;
                });
            } else {
                tagsHtml = `<span class="inline-block bg-gray-100 text-gray-600 text-xs font-semibold px-2.5 py-1 rounded-md">HTML5</span>`;
            }

            const htmlContent = `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full">
                    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
                        <div class="lg:w-3/4 flex flex-col gap-6">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-4">
                                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 m-0">${title}</h1>
                                <button onclick="toggleFullScreen()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm text-sm whitespace-nowrap">
                                    <i class="fa-solid fa-expand"></i>
                                    Play Fullscreen
                                </button>
                            </div>

                            <div class="relative w-full bg-black rounded-xl overflow-hidden shadow-lg border-4 border-gray-800/50" style="padding-top: 56.25%;" id="game-container">
                                <iframe id="game-iframe" src="${url}" class="absolute top-0 left-0 w-full h-full border-0" allowfullscreen="true" scrolling="no"></iframe>
                            </div>

                            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                <h2 class="text-xl font-bold mb-3 text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-3">
                                    <i class="fa-solid fa-align-left text-indigo-500"></i> Description
                                </h2>
                                <p class="text-gray-600 mb-8 leading-relaxed text-[15px]">${formattedDesc}</p>
                                
                                <h2 class="text-xl font-bold mb-3 text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-3">
                                    <i class="fa-solid fa-gamepad text-indigo-500"></i> Instructions
                                </h2>
                                <div class="bg-indigo-50 text-indigo-900 p-4 rounded-lg border border-indigo-100 text-[15px]">
                                    ${instructions}
                                </div>
                            </div>
                        </div>

                        <div class="lg:w-1/4 flex flex-col gap-6">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                <h3 class="font-bold text-gray-700 text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i class="fa-solid fa-film text-indigo-500"></i> Game Trailer
                                </h3>
                                <div id="gamemonetize-video"></div>
                            </div>

                            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                <img src="${thumb}" alt="${title}" class="w-full h-auto rounded-lg mb-5 shadow-sm border border-gray-100 object-cover aspect-[4/3]" onerror="this.src='https://placehold.co/512x384/1e293b/60a5fa?text=Preview'">
                                
                                <div class="mb-5">
                                    <h3 class="font-bold text-gray-500 text-sm uppercase tracking-wider mb-2">Category</h3>
                                    <span class="inline-block bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-md text-sm shadow-sm">${category}</span>
                                </div>
                                
                                <div>
                                    <h3 class="font-bold text-gray-500 text-sm uppercase tracking-wider mb-2">Tags</h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${tagsHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app-container').innerHTML = htmlContent;
            document.title = title + " - Bekeirat Software";

            window.VIDEO_OPTIONS = {
                gameid: id,
                width: "100%",
                height: "280px",
                color: "#3f007e",
                getAds: "false"
            };
            
            const scriptId = "gamemonetize-video-api";
            if (!document.getElementById(scriptId)) {
                const script = document.createElement("script");
                script.id = scriptId;
                script.type = "text/javascript";
                script.src = "https://api.gamemonetize.com/video.js";
                document.body.appendChild(script);
            }
        }

        function showError(message) {
            document.getElementById('app-container').innerHTML = `
                <div id="error-message">
                    <i class="fa-solid fa-triangle-exclamation text-5xl mb-4 text-red-500"></i>
                    <h2>Oops! Feed or Game Not Found</h2>
                    <p class="mb-4 text-gray-600 max-w-lg mx-auto">${message}</p>
                    <a href="../index.html" class="inline-block mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Return to Home</a>
                </div>
            `;
        }

        function toggleFullScreen() {
            const gameContainer = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen();
                } else if (gameContainer.webkitRequestFullscreen) {
                    gameContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.onload = loadGameData;
    </script>
</body>
</html>
