    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        const JSON_FEED_PATH = '../data/all.json';
        
        let allGamesData = []; // Store all games for the carousel

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('active');
        }

        async function loadGameData() {
            if (!gameId) {
                showError("No Game ID specified in the URL. Please return to the games list and select a game.");
                return;
            }
            
            try {
                const response = await fetch(JSON_FEED_PATH);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const games = await response.json();
                
                let gameData = null;
                if (Array.isArray(games)) {
                    allGamesData = games;
                    gameData = games.find(g => String(g.id) === String(gameId) || String(g.gameId) === String(gameId));
                } else if (games && typeof games === 'object') {
                    const list = games.games || games.items || Object.values(games);
                    if (Array.isArray(list)) {
                        allGamesData = list;
                        gameData = list.find(g => g && (String(g.id) === String(gameId) || String(g.gameId) === String(gameId)));
                    }
                }
                
                if (gameData) {
                    renderGamePage(gameData);
                } else {
                    showError(`Game ID "${gameId}" was not found inside "${JSON_FEED_PATH}". Please verify the game exists in your JSON list.`);
                }
            } catch (err) {
                showError(`Failed to load or parse "${JSON_FEED_PATH}". Error: ${err.message}`);
                console.error("Fetch error details:", err);
            }
        }

        function renderGamePage(game) {
            const title = game.title || game.name || "Untitled Game";
            const description = game.description || game.desc || "No description provided.";
            const category = game.category || game.genre || "Arcade";
            const tags = game.tags || game.keywords || "";
            const thumb = game.thumb || game.thumbnail || game.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
            const url = game.url || game.gameUrl || game.link || "";
            const id = game.id || game.gameId || gameId;

            let formattedDesc = String(description).replace(/&ndash;/g, '-').replace(/&amp;/g, '&').replace(/\*\*/g, '');
            
            const categoriesArray = String(category).split(',').map(c => c.trim()).filter(c => c !== '');
            let categoriesHtml = '';
            categoriesArray.forEach(cat => {
                categoriesHtml += `<a href="./games.html?category=${encodeURIComponent(cat)}" class="category-badge">${cat}</a>`;
            });

            const tagsArray = String(tags).split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            let tagsHtml = '';
            if (tagsArray.length > 0) {
                tagsArray.forEach(tag => {
                    tagsHtml += `<a href="./games.html?tag=${encodeURIComponent(tag)}" class="tag-badge">${tag}</a>`;
                });
            } else {
                tagsHtml = `<a href="./games.html?tag=HTML5" class="tag-badge">HTML5</a>`;
            }

            // Get related games for carousel (same category or random)
            let relatedGames = allGamesData.filter(g => 
                (String(g.id) !== String(id) && String(g.gameId) !== String(id)) && 
                (String(g.category).includes(categoriesArray[0]) || String(g.genre).includes(categoriesArray[0]))
            );
            
            // If not enough related games, pad with random ones
            if (relatedGames.length < 6) {
                const otherGames = allGamesData.filter(g => String(g.id) !== String(id) && String(g.gameId) !== String(id));
                const needed = 6 - relatedGames.length;
                for(let i=0; i<needed && i<otherGames.length; i++) {
                    if(!relatedGames.includes(otherGames[i])) {
                        relatedGames.push(otherGames[i]);
                    }
                }
            }

            let carouselItemsHtml = '';
            relatedGames.slice(0, 10).forEach(rg => {
                const rgThumb = rg.thumb || rg.thumbnail || rg.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
                const rgTitle = rg.title || rg.name || "Game";
                const rgId = rg.id || rg.gameId;
                carouselItemsHtml += `
                    <div class="carousel-item" onclick="window.location.href='?id=${rgId}'">
                        <img src="${rgThumb}" alt="${rgTitle}" loading="lazy">
                        <div class="carousel-item-title">${rgTitle}</div>
                    </div>
                `;
            });

            const htmlContent = `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full text-slate-200">
                    
                    <!-- Header Section -->
                    <div class="game-header">
                        <img src="${thumb}" alt="${title}" class="w-24 h-24 md:w-32 md:h-32 rounded-2xl shadow-lg border-2 border-slate-700 object-cover hidden sm:block">
                        <div class="game-title-area">
                            <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-4 tracking-tight drop-shadow-md">${title}</h1>
                            <div class="mb-4">
                                ${categoriesHtml}
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
                        
                        <!-- Main Left Column -->
                        <div class="lg:w-2/3 flex flex-col gap-6">
                            
                            <!-- Game Iframe Container -->
                            <div class="relative w-full rounded-xl overflow-hidden shadow-2xl" style="padding-top: 56.25%;" id="game-container">
                                <iframe id="game-iframe" src="${url}" class="absolute top-0 left-0 w-full h-full border-0" allowfullscreen="true" scrolling="no"></iframe>
                            </div>

                            <!-- Description Section -->
                            <div class="section-panel">
                                <h2 class="section-title">Description</h2>
                                <p class="text-slate-300 leading-relaxed text-[16px]">${formattedDesc}</p>
                            </div>
                            
                            <!-- Tags Section -->
                            <div class="section-panel">
                                <h2 class="section-title">Tags</h2>
                                <div class="flex flex-wrap gap-2">
                                    ${tagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Right Sidebar -->
                        <div class="lg:w-1/3 flex flex-col gap-6">
                            
                            <!-- Game Trailer Section -->
                            <div class="section-panel !p-4">
                                <h2 class="section-title text-sm uppercase tracking-widest text-slate-400 border-none mb-2 pb-0">Game Trailer</h2>
                                <div id="gamemonetize-video" class="rounded-lg overflow-hidden border border-slate-700 min-h-[250px] bg-slate-800"></div>
                            </div>

                            <!-- Thumbnail Section (visible on mobile if header thumb is hidden) -->
                            <div class="section-panel sm:hidden">
                                 <img src="${thumb}" alt="${title}" class="w-full h-auto rounded-lg shadow-sm border border-slate-700 object-cover aspect-[4/3]">
                            </div>

                            <!-- Carousel Section -->
                            <div class="section-panel small-carousel-panel">
                                <h2 class="section-title text-sm uppercase tracking-widest text-slate-400 border-none mb-4 pb-0">You may also like</h2>
                                <div class="carousel-container" id="related-carousel">
                                    <div class="carousel-track" id="carousel-track">
                                        ${carouselItemsHtml}
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app-container').innerHTML = htmlContent;
            document.title = title + " - Bekeirat Software";

            // Initialize GameMonetize Video using an isolated iframe 
            // to ensure the third-party script executes reliably after dynamic loading
            const trailerContainer = document.getElementById('gamemonetize-video');
            if (trailerContainer) {
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.minHeight = '250px';
                iframe.style.border = 'none';
                iframe.scrolling = 'no';
                iframe.allow = 'autoplay; fullscreen';
                
                const trailerHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            body { margin: 0; padding: 0; background-color: transparent; }
                            #gamemonetize-video { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
                        </style>
                    </head>
                    <body>
                        <div id="gamemonetize-video"></div>
                        <script type="text/javascript">
                           window.VIDEO_OPTIONS = {
                               gameid : "${id}",
                               width  : "100%",
                               height : "250px",
                               color  : "#3f007e",
                               getAds : "false"
                           };
                           (function (a, b, c) {
                              var d = a.getElementsByTagName(b)[0];
                              a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/video.js", d.parentNode.insertBefore(a, d))
                           })(document, "script", "gamemonetize-video-api"); 
                        <` + `/script>
                    </body>
                    </html>
                `;
                
                trailerContainer.innerHTML = '';
                trailerContainer.appendChild(iframe);
                
                // Write the GameMonetize snippet securely inside the new iframe document
                const iframeDoc = iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(trailerHtml);
                iframeDoc.close();
            }
            
            initCarousel();
        }

        function initCarousel() {
            const track = document.getElementById('carousel-track');
            if (!track) return;

            let currentIndex = 0;
            const items = track.children;
            if(items.length === 0) return;
            
            const totalItems = items.length;
            
            // Determine items per view based on width (rudimentary responsive check)
            let itemsPerView = 3;
            if (window.innerWidth <= 640) itemsPerView = 1;
            else if (window.innerWidth <= 1024) itemsPerView = 2;
            
            // Auto slide interval
            setInterval(() => {
                if (totalItems <= itemsPerView) return; // Don't slide if not enough items

                currentIndex++;
                if (currentIndex > totalItems - itemsPerView) {
                    currentIndex = 0; // Reset to start
                }
                
                // Calculate item width including gap
                const itemWidth = items[0].getBoundingClientRect().width;
                const gap = parseFloat(window.getComputedStyle(track).gap) || 16; // 1rem gap
                
                const slideAmount = currentIndex * (itemWidth + gap);
                track.style.transform = `translateX(-${slideAmount}px)`;
            }, 3000); // Slide every 3 seconds
            
            // Handle window resize to recalculate slide amounts
            window.addEventListener('resize', () => {
                currentIndex = 0;
                track.style.transform = `translateX(0px)`;
                if (window.innerWidth <= 640) itemsPerView = 1;
                else if (window.innerWidth <= 1024) itemsPerView = 2;
                else itemsPerView = 3;
            });
        }

        function showError(message) {
            document.getElementById('app-container').innerHTML = `
                <div id="error-message">
                    <i class="fa-solid fa-triangle-exclamation text-5xl mb-4 text-red-500"></i>
                    <h2>Oops!</h2>
                    <p class="mb-4 text-slate-400 max-w-lg mx-auto">${message}</p>
                    <p class="mb-4 text-sm text-slate-500 max-w-lg mx-auto">Check if the URL ${window.location.origin}/${JSON_FEED_PATH.replace('../','')} exists and is accessible.</p>
                    <a href="../index.html" class="inline-block mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Return to Home</a>
                </div>
            `;
        }

        window.onload = loadGameData;
    </script>
</body>
