    <!-- Execution Engine Script -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        const JSON_FEED_PATH = '../data/all.json';
        
        let allGamesData = [];

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Set current year
        document.getElementById('current-year').textContent = new Date().getFullYear();

        async function loadGameData() {
            if (!gameId) {
                showError("No Game ID specified in the URL. Please return to the games list and select a game.");
                return;
            }

            try {
                // Simulate network delay for loading effect
                await new Promise(resolve => setTimeout(resolve, 600));

                const response = await fetch(JSON_FEED_PATH);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const games = await response.json();

                let gameData = null;
                if (Array.isArray(games)) {
                    allGamesData = games;
                    gameData = games.find(g => String(g.id) === String(gameId) || String(g.gameId) === String(gameId));
                } else if (games && typeof games === 'object') {
                    const list = games.games || games.items || Object.values(games);
                    if (Array.isArray(list)) {
                        allGamesData = list;
                        gameData = list.find(g => g && (String(g.id) === String(gameId) || String(g.gameId) === String(gameId)));
                    }
                }

                if (gameData) {
                    renderGamePage(gameData);
                } else {
                    showError(`Game ID "${gameId}" was not found inside the database. Please verify the game exists.`);
                }
            } catch (err) {
                showError(`Failed to load game database. Error: ${err.message}`);
                console.error("Fetch error details:", err);
            }
        }

        function renderGamePage(game) {
            const title = game.Title || game.title || game.name || "Untitled Game";
            const description = game.Description || game.description || game.desc || "No description provided.";
            const category = game.Category || game.category || game.genre || "Arcade";
            const tags = game.Tags || game.tags || game.keywords || "";
            const thumb = game.Image || game.thumb || game.thumbnail || game.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
            const id = game.id || game.gameId || gameId;

            // Use the Embed HTML if provided, otherwise fallback to Url
            let embedCode = game.Embed;
            if (!embedCode) {
                const url = game.Url || game.Play || game.url || game.gameUrl || game.link || "";
                embedCode = `<iframe id="game-iframe" src="${url}" allow="autoplay; fullscreen; encrypted-media; accelerometer; gyroscope" allowfullscreen="true" scrolling="no"></iframe>`;
            }

            let formattedDesc = String(description).replace(/&ndash;/g, '-').replace(/&amp;/g, '&').replace(/\*\*/g, '');

            // Render Categories
            const categoriesArray = String(category).split(',').map(c => c.trim()).filter(c => c !== '');
            let categoriesHtml = '';
            categoriesArray.forEach(cat => {
                categoriesHtml += `<a href="./games.html?category=${encodeURIComponent(cat)}" class="category-badge"><i class="fa-solid fa-gamepad mr-2 opacity-70"></i>${cat}</a>`;
            });

            // Render Tags
            const tagsArray = String(tags).split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            let tagsHtml = '';
            if (tagsArray.length > 0) {
                tagsArray.forEach(tag => {
                    tagsHtml += `<a href="./games.html?tag=${encodeURIComponent(tag)}" class="tag-badge"><i class="fa-solid fa-hashtag mr-1 text-blue-400"></i>${tag}</a>`;
                });
            } else {
                tagsHtml = `<a href="./games.html?tag=HTML5" class="tag-badge"><i class="fa-brands fa-html5 mr-1 text-orange-500"></i>HTML5</a>`;
            }

            // Get related games (same category or random)
            let relatedGames = allGamesData.filter(g =>
                (String(g.id) !== String(id) && String(g.gameId) !== String(id)) &&
                (String(g.Category || g.category || g.genre).includes(categoriesArray[0]))
            );

            if (relatedGames.length < 6) {
                const otherGames = allGamesData.filter(g => String(g.id) !== String(id) && String(g.gameId) !== String(id));
                const needed = 6 - relatedGames.length;
                for (let i = 0; i < needed && i < otherGames.length; i++) {
                    if (!relatedGames.includes(otherGames[i])) {
                        relatedGames.push(otherGames[i]);
                    }
                }
            }

            // Generate CSS Grid items instead of a buggy carousel for the sidebar
            let gridItemsHtml = '';
            relatedGames.slice(0, 6).forEach(rg => {
                const rgThumb = rg.Image || rg.thumb || rg.thumbnail || rg.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
                const rgTitle = rg.Title || rg.title || rg.name || "Game";
                const rgId = rg.id || rg.gameId;
                
                gridItemsHtml += `
                    <a href="?id=${rgId}" class="group relative block rounded-xl overflow-hidden shadow-md border border-slate-700 hover:border-blue-500 hover:shadow-[0_0_15px_rgba(59,130,246,0.3)] transition-all duration-300">
                        <img src="${rgThumb}" alt="${rgTitle}" loading="lazy" class="w-full h-24 object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        <div class="absolute bottom-0 w-full p-2 text-center">
                            <h3 class="text-xs font-bold text-gray-100 truncate drop-shadow-md group-hover:text-blue-300 transition-colors">${rgTitle}</h3>
                        </div>
                    </a>
                `;
            });

            const htmlContent = `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full">
                    
                    <!-- Title & Header Area -->
                    <div class="animate-fade-in flex items-center gap-6 mb-8">
                        <img src="${thumb}" alt="${title}" class="w-24 h-24 md:w-28 md:h-28 rounded-2xl shadow-xl border border-slate-700 object-cover hidden sm:block">
                        <div>
                            <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3 tracking-tight drop-shadow-lg font-poppins">${title}</h1>
                            <div class="flex flex-wrap gap-2">
                                ${categoriesHtml}
                            </div>
                        </div>
                    </div>

                    <!-- Main Content Layout -->
                    <div class="flex flex-col lg:flex-row gap-8">
                        
                        <!-- Left Column (Game & Details) -->
                        <div class="lg:w-2/3 flex flex-col gap-8">
                            
                            <!-- Game Frame Container -->
                            <div class="relative w-full rounded-2xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.5)] border border-slate-700/80 bg-black aspect-video animate-slide-up" style="animation-delay: 0.1s;">
                               ${embedCode}
                            </div>

                            <!-- Description Section -->
                            <div class="bg-[#171a23] border border-slate-800 rounded-xl p-6 md:p-8 animate-slide-up shadow-sm" style="animation-delay: 0.2s;">
                                <h2 class="font-poppins text-xl font-bold text-blue-400 border-b border-slate-700/60 pb-3 mb-5 flex items-center">
                                    <i class="fa-solid fa-align-left mr-3"></i> Game Description
                                </h2>
                                <p class="text-slate-300 leading-relaxed text-[15px]">${formattedDesc}</p>
                            </div>
                            
                            <!-- Tags Section -->
                            <div class="bg-[#171a23] border border-slate-800 rounded-xl p-6 animate-slide-up shadow-sm" style="animation-delay: 0.3s;">
                                <h2 class="font-poppins text-xl font-bold text-purple-400 border-b border-slate-700/60 pb-3 mb-5 flex items-center">
                                    <i class="fa-solid fa-tags mr-3"></i> Tags & Features
                                </h2>
                                <div class="flex flex-wrap gap-2">
                                    ${tagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Right Sidebar -->
                        <div class="lg:w-1/3 flex flex-col gap-8">
                            
                            <!-- Mobile-only Thumbnail -->
                            <div class="sm:hidden animate-slide-up" style="animation-delay: 0.1s;">
                                 <img src="${thumb}" alt="${title}" class="w-full h-auto rounded-xl shadow-md border border-slate-700 object-cover aspect-video">
                            </div>

                            <!-- You May Also Like (Sticky Container) -->
                            <div class="sticky top-24 bg-[#171a23] border border-slate-800 rounded-xl p-6 animate-slide-up shadow-sm" style="animation-delay: 0.4s;">
                                <h2 class="font-poppins text-lg font-bold text-orange-400 border-b border-slate-700/60 pb-3 mb-5 flex items-center">
                                    <i class="fa-solid fa-fire mr-3"></i> You May Also Like
                                </h2>
                                
                                <!-- Rendered as a neat grid instead of horizontal scroll for better sidebar UX -->
                                <div class="grid grid-cols-2 gap-3">
                                    ${gridItemsHtml}
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            `;

            // Inject the generated UI
            document.getElementById('app-container').innerHTML = htmlContent;
            document.title = title + " - Bekeirat Software";
        }

        function showError(message) {
            document.getElementById('app-container').innerHTML = `
                <div class="py-32 flex flex-col items-center text-center animate-slide-up px-4">
                    <div class="bg-red-500/10 p-6 rounded-full border border-red-500/20 mb-6">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 drop-shadow-md"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold text-white mb-4 font-poppins">Oops! Something went wrong.</h2>
                    <p class="text-slate-300 max-w-lg mx-auto text-lg mb-8 leading-relaxed">${message}</p>
                    <a href="../index.html" class="inline-flex items-center gap-2 px-8 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-500 transform hover:-translate-y-1 transition-all duration-300">
                        <i class="fa-solid fa-arrow-left"></i> Return Home
                    </a>
                </div>
            `;
        }

        // Initialize application
        window.onload = loadGameData;
    </script>
</body>
