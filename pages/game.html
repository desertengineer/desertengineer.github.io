    <script>
        /**
         * 1. Get the Game ID from the URL (e.g., game.html?id=82166)
         */
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        // The path to your JSON file based on your directory structure
        const FEED_URL = 'data/all.json';

        /**
         * 2. Function to fetch and parse the JSON feed
         */
        async function loadGameData() {
            if (!gameId) {
                showError("No Game ID specified in the URL.");
                return;
            }
            
            try {
                const response = await fetch(FEED_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Parse the JSON array
                const games = await response.json();
                
                // Find the specific game by matching the ID string
                const gameData = games.find(g => g.id === gameId);
                
                if (gameData) {
                    renderGamePage(gameData);
                } else {
                    showError("Game not found in our database.");
                }
            } catch (error) {
                console.error("Could not fetch game data:", error);
                // Helpful error message for local testing (CORS issues)
                showError("Failed to load game data. (Ensure you are running this over a local server to avoid CORS issues).");
            } 
        }

        /**
         * 3. Inject the parsed data into the HTML layout
         */
        function renderGamePage(game) {
            
            // Format Description: Clean up basic HTML entities or markdown-like characters
            let formattedDesc = game.description.replace(/&ndash;/g, '-').replace(/&amp;/g, '&').replace(/\*\*/g, '');
            
            // Format Tags: Convert comma separated tags to HTML badges
            const tagsArray = game.tags.split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            let tagsHtml = '';
            tagsArray.forEach(tag => {
                tagsHtml += `<span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-md border border-blue-200">${tag}</span>`;
            });

            const htmlContent = `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full">
                    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
                        
                        <!-- Left Main Column (Game Player & Info) -->
                        <div class="lg:w-3/4 flex flex-col gap-6">
                            
                            <!-- Header Bar -->
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-4">
                                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 m-0">${game.title}</h1>
                                <button onclick="toggleFullScreen()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm text-sm whitespace-nowrap">
                                    <i class="fa-solid fa-expand"></i>
                                    Play Fullscreen
                                </button>
                            </div>

                            <!-- Responsive Game Container (16:9 Aspect Ratio by default) -->
                            <div class="relative w-full bg-black rounded-xl overflow-hidden shadow-lg border-4 border-gray-800/50" style="padding-top: 56.25%;" id="game-container">
                                <iframe id="game-iframe" src="${game.url}" class="absolute top-0 left-0 w-full h-full border-0" allowfullscreen="true" scrolling="no"></iframe>
                            </div>

                            <!-- Game Details Card -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                <h2 class="text-xl font-bold mb-3 text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-3">
                                    <i class="fa-solid fa-align-left text-indigo-500"></i> Description
                                </h2>
                                <p class="text-gray-600 mb-8 leading-relaxed text-[15px]">${formattedDesc}</p>
                                
                                <h2 class="text-xl font-bold mb-3 text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-3">
                                    <i class="fa-solid fa-gamepad text-indigo-500"></i> Instructions
                                </h2>
                                <div class="bg-indigo-50 text-indigo-900 p-4 rounded-lg border border-indigo-100 text-[15px]">
                                    ${game.instructions}
                                </div>
                            </div>
                        </div>

                        <!-- Right Sidebar Column (Metadata & Ads) -->
                        <div class="lg:w-1/4 flex flex-col gap-6">
                            
                            <!-- Game Trailer Widget (Aside Top) -->
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                <h3 class="font-bold text-gray-700 text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i class="fa-solid fa-film text-indigo-500"></i> Game Trailer
                                </h3>
                                <div id="gamemonetize-video"></div>
                            </div>

                            <!-- Thumbnail & Meta Card -->
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                <img src="${game.thumb}" alt="${game.title}" class="w-full h-auto rounded-lg mb-5 shadow-sm border border-gray-100 object-cover aspect-[4/3]">
                                
                                <div class="mb-5">
                                    <h3 class="font-bold text-gray-500 text-sm uppercase tracking-wider mb-2">Category</h3>
                                    <span class="inline-block bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-md text-sm shadow-sm">${game.category}</span>
                                </div>
                                
                                <div>
                                    <h3 class="font-bold text-gray-500 text-sm uppercase tracking-wider mb-2">Tags</h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${tagsHtml}
                                    </div>
                                </div>
                            </div>

                            <!-- Ad Placement Area -->
                            <div class="bg-gray-100 rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center min-h-[300px] text-gray-400 p-4 text-center">
                                <i class="fa-solid fa-ad text-3xl mb-2 opacity-50"></i>
                                <span class="font-medium text-sm">Advertisement Space</span>
                                <span class="text-xs mt-1 opacity-75">300x250 or 300x600</span>
                            </div>
                            
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app-container').innerHTML = htmlContent;
            document.title = game.title + " - Desert Engineer";

            // Inject the GameMonetize Video Trailer script dynamically with the correct game ID
            window.VIDEO_OPTIONS = {
                gameid : game.id,
                width  : "100%",
                height : "280px",
                color  : "#3f007e",
                getAds : "false"
            };
            
            const scriptId = "gamemonetize-video-api";
            if (!document.getElementById(scriptId)) {
                const script = document.createElement("script");
                script.id = scriptId;
                script.type = "text/javascript";
                script.src = "https://api.gamemonetize.com/video.js";
                document.body.appendChild(script);
            } else {
                // If the script is already loaded, re-initialize if the API supports it
                if (typeof loadVideoAds === 'function') {
                    loadVideoAds();
                }
            }
        }

        /**
         * Helper function to show errors
         */
        function showError(message) {
            document.getElementById('app-container').innerHTML = `
                <div id="error-message">
                    <i class="fa-solid fa-triangle-exclamation text-5xl mb-4 text-red-500"></i>
                    <h2>Oops!</h2>
                    <p>${message}</p>
                    <a href="../index.html" class="inline-block mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Return to Home</a>
                </div>
            `;
        }

        /**
         * Toggle Fullscreen for the game iframe natively
         */
        function toggleFullScreen() {
            const gameContainer = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen();
                } else if (gameContainer.webkitRequestFullscreen) { /* Safari */
                    gameContainer.webkitRequestFullscreen();
                } else if (gameContainer.msRequestFullscreen) { /* IE11 */
                    gameContainer.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }

        // Initialize the script when the window loads
        window.onload = loadGameData;
    </script>
