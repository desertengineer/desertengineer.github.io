    <!-- Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Monetization -->
    <meta name="google-adsense-account" content="ca-pub-2658659289706339">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2658659289706339" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
        }
        h1, h2, h3, .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        .game-frame-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
        }
        .game-frame-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body class="text-gray-100 min-h-screen flex flex-col antialiased">
    <!-- Top Navigation Bar -->
    <nav class="px-4 md:px-8 py-4 flex flex-wrap items-center justify-between border-b border-gray-800/80 bg-[#12141f] sticky top-0 z-50 shadow-md">
        <a href="../index.html"
            class="flex items-center gap-3 text-2xl font-bold tracking-wider text-blue-400 hover:text-blue-300 transition-colors font-poppins">
            <img src="../assets/Bekeirat-Software-120x120.png" alt="Bekeirat Software Logo"
                width="45" height="45" class="w-[45px] h-[45px] object-contain rounded-lg bg-white/10"
                onerror="this.src='https://placehold.co/120x120/1e293b/60a5fa?text=BS'">
            Bekeirat Software
        </a>

        <button id="hamburger-btn"
            class="md:hidden text-white focus:outline-none hover:text-blue-400 transition-colors p-2"
            aria-label="Toggle Menu" onclick="toggleMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
        </button>

        <div class="hidden md:flex space-x-6 items-center font-medium">
            <a href="../index.html" class="text-gray-300 hover:text-white transition-colors">Home</a>
            <a href="./about.html" class="text-gray-300 hover:text-white transition-colors">About Us</a>
            <a href="./games.html" class="text-blue-400 font-bold border-b-2 border-blue-400 pb-1">Games</a>
            <a href="./contact us.html" class="text-gray-300 hover:text-white transition-colors">Contacts</a>
        </div>

        <div id="mobile-menu" class="hidden w-full mt-4 pb-2 shadow-inner">
            <nav class="flex flex-col space-y-2">
                <a href="../index.html" class="px-4 py-2 text-gray-300 hover:bg-gray-800 rounded">Home</a>
                <a href="./about.html" class="px-4 py-2 text-gray-300 hover:bg-gray-800 rounded">About Us</a>
                <a href="./games.html" class="px-4 py-2 text-blue-400 font-bold bg-gray-800/50 rounded">Games</a>
                <a href="./contact us.html" class="px-4 py-2 text-gray-300 hover:bg-gray-800 rounded">Contacts</a>
            </nav>
        </div>
    </nav>

    <!-- Main Game Player Area -->
    <main class="flex-grow w-full max-w-6xl mx-auto px-4 py-8 space-y-8" id="app-container">
        <div id="loading-message" class="flex flex-col items-center justify-center py-32">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-500 mb-6 drop-shadow-lg"></i>
            <span class="text-2xl font-semibold font-poppins text-gray-300 tracking-wide">Loading Game Environment...</span>
        </div>

        <div id="game-content" class="hidden space-y-6">
            <!-- Header Info -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#12141f] p-6 rounded-2xl border border-gray-800 shadow-xl">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <span id="game-category-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-400/30">Arcade</span>
                        <span id="game-tags-badge" class="text-xs text-gray-400 font-mono">#HTML5 #InstantPlay</span>
                    </div>
                    <h1 id="game-title" class="text-2xl md:text-4xl font-black text-white">Game Title</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleFullscreen()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-blue-600 text-gray-200 hover:text-white border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                        <i class="fa-solid fa-expand"></i> Fullscreen
                    </button>
                    <a href="./games.html" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-gray-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> Back to Hub
                    </a>
                </div>
            </div>

            <!-- Iframe Player Container -->
            <div id="player-container" class="game-frame-wrapper shadow-2xl border border-blue-500/20">
                <!-- Iframe injected via JS -->
            </div>

            <!-- Description & Instructions -->
            <div class="bg-[#12141f] p-6 md:p-8 rounded-2xl border border-gray-800 shadow-xl space-y-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-blue-400"></i> About & Instructions
                </h2>
                <p id="game-description" class="text-gray-300 text-sm md:text-base leading-relaxed">
                    Loading description...
                </p>
                <div id="instructions-container" class="hidden pt-2 border-t border-gray-800">
                    <h3 class="text-sm font-bold text-blue-400 uppercase tracking-wider mb-2">How to Play</h3>
                    <p id="game-instructions" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-12 px-4 text-center border-t border-gray-800/80 mt-auto">
        <div class="max-w-4xl mx-auto flex flex-col items-center">
            <div class="mb-8">
                <a href="../privacy/" class="hover:text-white transition-colors underline text-sm">Privacy Policy</a>
            </div>
            <div>
                <p class="text-sm">&copy; <span id="current-year"></span> Bekeirat Software. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        function toggleFullscreen() {
            const container = document.getElementById('player-container');
            if (!container) return;
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable fullscreen:", err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();

            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('id');

            let gameData = null;

            // 1. Try sessionStorage first
            try {
                const cached = sessionStorage.getItem('current_game_data');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && (String(parsed.id) === String(gameId) || !gameId)) {
                        gameData = parsed;
                    }
                }
            } catch (e) {}

            // 2. Check localStorage catalogs
            if (!gameData && gameId) {
                const cacheKeys = ['bekeiratGamesData', 'bekeirat_homepage_catalog'];
                for (const key of cacheKeys) {
                    try {
                        const localCache = localStorage.getItem(key);
                        if (localCache) {
                            const parsed = JSON.parse(localCache);
                            const list = Array.isArray(parsed) ? parsed : (parsed.data || []);
                            gameData = list.find(g => String(g.id) === String(gameId));
                            if (gameData) break;
                        }
                    } catch (e) {}
                }
            }

            // 3. Fallback: single daily file fetch
            if (!gameData && gameId) {
                try {
                    const today = new Date();
                    const dayNum = today.getDay() === 0 ? 7 : today.getDay();
                    const res = await fetch(`../data/all_${dayNum}.json`);
                    if (res.ok) {
                        const raw = await res.json();
                        if (Array.isArray(raw)) {
                            const found = raw.find(item => String(item.id || item.Id) === String(gameId));
                            if (found) {
                                gameData = {
                                    id: found.id || found.Id,
                                    title: found.Title || found.title || 'Game',
                                    description: found.Description || found.description || '',
                                    instructions: found.Instructions || found.instructions || '',
                                    play: found.Play || found.play || found.Url || found.url || '',
                                    category: found.Category || found.category || 'Arcade',
                                    tags: found.Tags || []
                                };
                            }
                        }
                    }
                } catch (e) {}
            }

            if (gameData) {
                renderGame(gameData);
            } else {
                renderError('Game not found or invalid session. Please select a game from the games hub.');
            }
        });

        function renderGame(game) {
            document.getElementById('loading-message').classList.add('hidden');
            document.getElementById('game-content').classList.remove('hidden');

            document.getElementById('page-title').textContent = `${game.title} - Bekeirat Software`;
            document.getElementById('meta-description').content = game.description || `Play ${game.title} online at Bekeirat Software.`;

            document.getElementById('game-title').textContent = game.title;
            document.getElementById('game-category-badge').textContent = game.category || 'Arcade';
            document.getElementById('game-description').textContent = game.description || `Enjoy playing ${game.title} instantly in your web browser with no downloads required.`;

            if (game.instructions) {
                document.getElementById('game-instructions').textContent = game.instructions;
                document.getElementById('instructions-container').classList.remove('hidden');
            }

            if (Array.isArray(game.tags) && game.tags.length > 0) {
                document.getElementById('game-tags-badge').textContent = game.tags.map(t => `#${t}`).join(' ');
            }

            const playUrl = game.play || game.url || '';
            const playerContainer = document.getElementById('player-container');

            if (playUrl && playUrl !== '#') {
                playerContainer.innerHTML = `<iframe src="${playUrl}" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" scrolling="no"></iframe>`;
            } else {
                playerContainer.innerHTML = `<div class="w-full h-full flex items-center justify-center p-8 text-center text-red-400">Game source URL is not available.</div>`;
            }
        }

        function renderError(msg) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-md mx-auto my-32 p-8 bg-[#12141f] rounded-2xl border border-red-500/30 text-center space-y-4 shadow-2xl">
                    <i class="fa-solid fa-triangle-exclamation text-4xl text-red-400"></i>
                    <h2 class="text-xl font-bold text-white">Unable to Load Game</h2>
                    <p class="text-sm text-gray-400">${msg}</p>
                    <a href="./games.html" class="inline-block px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold transition-all shadow-lg">Return to Games Hub</a>
                </div>
            `;
        }
    </script>
</body>

</html>
